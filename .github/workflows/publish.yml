name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag matches package version
        if: github.event_name == 'release'
        run: |
          v=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "v$v" = "${GITHUB_REF_NAME}"
      - name: Assemble drive code
        run: docker build --target drivecode-bin --output type=local,dest=nybulah/drivecode-out .
      - name: Install drive code into the package
        run: |
          cp nybulah/drivecode-out/*.bin nybulah/drivecode/
          rm -rf nybulah/drivecode-out
          test -n "$(ls nybulah/drivecode/*.bin)"
      - name: Build distributions
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
          unzip -l dist/*.whl | grep -q 'drivecode/.*\.bin'
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
