name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build drive code
        uses: docker/build-push-action@v7
        with:
          context: .
          target: drivecode
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          tags: nybulah:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: black
        run: docker run --rm nybulah:test black --check nybulah tests
      - name: pylint
        run: docker run --rm nybulah:test pylint nybulah tests
      - name: pytest
        run: >-
          docker run --rm nybulah:test python -m pytest -n auto -p no:cacheprovider
          --cov=nybulah --cov-report=term-missing --cov-fail-under=85
