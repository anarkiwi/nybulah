name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: echo "key=$(.github/basecache.sh key)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v6
        with:
          path: ~/basecache
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: .github/basecache.sh fetch
      - id: base
        run: |
          {
            echo 'contexts<<EOF'
            .github/basecache.sh up
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build drive code
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: ${{ steps.base.outputs.contexts }}
          target: drivecode
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: ${{ steps.base.outputs.contexts }}
          target: test
          tags: nybulah:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: black
        run: docker run --rm nybulah:test black --check nybulah tests
      - name: pylint
        run: docker run --rm nybulah:test pylint nybulah tests
      - name: pytest
        run: >-
          docker run --rm nybulah:test python -m pytest -n auto -p no:cacheprovider
          --cov=nybulah --cov-report=term-missing --cov-fail-under=85
