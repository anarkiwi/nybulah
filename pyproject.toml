[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nybulah"
version = "0.1.0"
description = "Commodore 1541/1571 nibbler over OpenCBM without a parallel cable"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "numba>=0.60", "tqdm>=4.66"]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "pillow>=10.1"]
dev = ["pytest>=8", "pytest-xdist>=3", "pytest-cov>=5", "black>=24", "pylint>=3", "py65>=1.2"]

[project.scripts]
nybulah = "nybulah.cli:console"

[tool.setuptools.packages.find]
include = ["nybulah*"]

[tool.setuptools.package-data]
"nybulah.drivecode" = ["*.bin"]
"nybulah" = ["thresholds.json", "fluxview.html"]

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8
max-attributes = 12
max-locals = 25
min-public-methods = 1
max-public-methods = 24

[tool.pylint."messages control"]
disable = ["missing-module-docstring", "missing-function-docstring", "import-outside-toplevel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: whole-disk simulations"]

[tool.coverage.run]
core = "sysmon"
